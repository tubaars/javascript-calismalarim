<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <script>

            function cember(yaricap) {
            var pi = 3.14;
            var alan = pi * yaricap * yaricap;
            var cevre = 2 * pi * yaricap;
            
            document.write("Çemberin Yarıçapı: " + yaricap + "<br>");
            document.write("Alan = " + alan + "<br>");
            document.write("Çevre = " + cevre);
        }

        var r = Number(prompt("Çemberin yarıçapını giriniz:"));
        cember(r);
            

        </script>
    </body>
</html>
