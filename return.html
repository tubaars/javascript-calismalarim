<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <script>

        // alınan sayının karesini hesaplayan fonksiyon

            function kare(a) {
            var kare = a * a;
            return kare;
        }
        
        var sayi = Number(prompt("sayi:"));
        var karesi = kare(sayi);
        alert(sayi + " sayısının karesi = " + karesi);
            

        </script>
    </body>
</html>
