<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <script>

            var ad = "Fahrettin";
        document.write(ad.length + "<br>"); //uzunluk
        document.write(ad.toLowerCase() +  "<br>"); // harf dönüşümleri
        document.write(ad.toUpperCase() + "<br>");
        document.write(ad.bold() + "<br>"); // biçimlendirme
        document.write(ad.italics() + "<br>");
        document.write(ad.charAt(5) + "<br>"); // belirli karakter seçme
        document.write(ad.substring(1, 5) + "<br>"); // kelime parçalama
            

        </script>
    </body>
</html>
