<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <script>

    // Sadece pozitif sayıların karesini alan program

    var sayi, kare;
        sayi = prompt("Sayı:");
        if(sayi < 0) {
            alert("Sayı Negatif!!!");
            alert("F5 ile ekranı tazeleyerek yeni sayı alın");
        } else {
            kare = sayi * sayi;
            alert("Kare=" + kare);
        }

        </script>
    </body>
</html>
