    <body>
        <script>
        
// Diktörtgenin alanı ve cevresini hesaplama

var g, y, alan, çevre;

g=Number(prompt("Genişlik:"));
y=Number(prompt("Yükseklik:"));

//Dikdörtgen alanı ve çevresinin hesabı
alan=g*y;
çevre=2*(g+y);

alert("Alan:"+alan+" Çevre:"+çevre);
            
        </script>
    </body>
