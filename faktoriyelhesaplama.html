<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <script>

            function fakto(x) {
            var f = 1;
            for (var s = 1; s <= x; s++) {
                f = f * s;
            }
            return f;
        }
        
        var n = Number(prompt("n:"));
        alert("n = " + n + " n! = " + fakto(n));
            

        </script>
    </body>
</html>
