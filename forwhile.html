<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <script>

        // 1'den n'e kadar sayıları yaz

            var n, s;
        n = prompt("n:");
        
        for (s = 1; s <= n; s++) {
            document.write(s + "<br>");
        }
      
        s = 1;
        while (s <= n) {
            document.write(s + "<br>");
            s++;
        }
            
        </script>
    </body>
</html>
