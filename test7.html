    <body>
        <script>
//Dairenin alanı ve çevresini hesaplama

var r, alan, çevre, pi=3.14;
//Yarıçapı alalım
r=Number(prompt("Yarıçap:"));

//Alan ve çevrenin hesabı
alan=pi*r*r;
çevre=2*pi*r;

//işlem sonucunu ekrana yazalım
alert("Alan:"+alan+" Çevre:"+çevre);

        </script>
    </body>
